  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 4px 8px">

          <span style="font-size: 30px; font-weight: 700; color: #5E5A73">₹</span>
          <input id="amount" value="2,400" style="border: none; outline: none; font-family: inherit; font-size: 40px; font-weight: 800; letter-spacing: -1px; color: #17142B; width: 100%; padding: 0; background: transparent">

    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 56px; border: 1px solid #E6E3EF; border-radius: 12px; background: #FFFFFF; font-family: inherit; text-align: left; padding: 0 12px"><div style="font-size: 11px; color: #5E5A73; font-weight: 600">Paid by</div><div style="font-size: 14px; font-weight: 700; color: #17142B">Priya</div></button>
      <button style="height: 56px; border: 1px solid #E6E3EF; border-radius: 12px; background: #FFFFFF; font-family: inherit; text-align: left; padding: 0 12px"><div style="font-size: 11px; color: #5E5A73; font-weight: 600">Category</div><div style="font-size: 14px; font-weight: 700; color: #17142B">Food</div></button>
      <button style="height: 56px; border: 1px solid #E6E3EF; border-radius: 12px; background: #FFFFFF; font-family: inherit; text-align: left; padding: 0 12px"><div style="font-size: 11px; color: #5E5A73; font-weight: 600">Date</div><div style="font-size: 14px; font-weight: 700; color: #17142B">10 Oct</div></button>

        <button style="height: 40px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #403B55">Exact</button>

    <div style="border: 1px solid #E6E3EF; border-radius: 14px; display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 52px; border-bottom: 1px solid #F0EEF5"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5B3FD6"><span style="flex-grow: 1; font-size: 15px; font-weight: 600">You</span><span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">₹480</span></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 52px; border-bottom: 1px solid #F0EEF5"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5B3FD6"><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Priya</span><span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">₹480</span></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 52px; border-bottom: 1px solid #F0EEF5"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5B3FD6"><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Meera</span><span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">₹480</span></label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 52px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5B3FD6"><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Arjun</span><span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">₹480</span></label>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #4329B0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      ₹2,400 of ₹2,400 assigned

    <span style="font-size: 13px; color: #5E5A73">5 people</span>
