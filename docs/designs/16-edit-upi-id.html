<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit your UPI ID</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4329B0}
</style>
</head>
<body>
<!-- Edit your UPI ID (Q1, F2). Opened from Profile → UPI ID → Edit, or from the first-time prompt (18).
     Saving updates your member row in every group. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5F5A72; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17142B">
  <div style="padding: 24px 20px; color: #E6E3EF; opacity: 0.55">
    <div style="font-size: 26px; font-weight: 800">Profile</div>
    <div style="margin-top: 20px; height: 90px; border-radius: 18px; background: #77728A"></div>
    <div style="margin-top: 16px; height: 70px; border-radius: 16px; background: #77728A"></div>
  </div>

  <section aria-label="Your UPI ID" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D8D4E4; align-self: center"></div>
    <h2 style="margin: 18px 0 0; font-size: 20px; font-weight: 800">Your UPI ID</h2>
    <p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #5E5A73">Friends in your groups see this when they pay you. Only you can change it.</p>

    <label for="upi" style="margin-top: 18px; font-size: 13px; font-weight: 600; color: #5E5A73">UPI ID</label>
    <input id="upi" value="ananya.r@okaxis" style="margin-top: 4px; box-sizing: border-box; width: 100%; height: 52px; border: 2px solid #5B3FD6; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 600; color: #17142B">
    <div style="margin-top: 6px; font-size: 13px; color: #5E5A73">Looks like name@bank. Find it in GPay, PhonePe or Paytm.</div>

    <button style="margin-top: 20px; height: 56px; border-radius: 16px; border: none; background: #5B3FD6; font-family: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF">Save</button>
  </section>
</div>
</body>
</html>
