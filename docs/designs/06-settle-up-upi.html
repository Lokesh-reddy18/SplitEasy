<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settle up with UPI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4329B0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5F5A72; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17142B">
  <div style="padding: 24px 20px; color: #E6E3EF; opacity: 0.55">
    <div style="font-size: 18px; font-weight: 700">Office lunches</div>
    <div style="font-size: 13px; margin-top: 2px">6 members</div>
    <div style="margin-top: 24px; height: 120px; border-radius: 18px; background: #77728A"></div>
    <div style="margin-top: 16px; height: 220px; border-radius: 16px; background: #77728A"></div>
  </div>

  <section aria-label="Settle up" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D8D4E4; align-self: center"></div>
    <h2 style="margin: 18px 0 0; font-size: 20px; font-weight: 800">Settle up</h2>
    <p style="margin: 4px 0 0; font-size: 14px; color: #5E5A73">Office lunches</p>

    <div style="margin-top: 18px; padding: 16px; border-radius: 16px; background: #F6F5FB; display: flex; align-items: center; gap: 12px">
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #FEF1E2; color: #8A4006; font-weight: 700; display: flex; align-items: center; justify-content: center">PS</div>
      <div style="flex-grow: 1"><div style="font-size: 13px; color: #5E5A73">You pay</div><div style="font-size: 16px; font-weight: 700">Priya Sharma</div><div style="font-size: 13px; color: #403B55">priya.s@okicici</div></div>
    </div>

    <label for="pay-amount" style="margin-top: 18px; font-size: 13px; font-weight: 600; color: #5E5A73">Amount</label>
    <div style="display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid #5B3FD6; padding-bottom: 6px; margin-top: 4px">
      <span style="font-size: 28px; font-weight: 700; color: #5E5A73">₹</span>
      <input id="pay-amount" value="600" style="border: none; outline: none; font-family: inherit; font-size: 38px; font-weight: 800; color: #17142B; width: 100%; padding: 0; background: transparent">
    </div>
    <div style="margin-top: 6px; font-size: 13px; color: #5E5A73">Full balance. You can pay part of it.</div>

    <label for="note" style="margin-top: 16px; font-size: 13px; font-weight: 600; color: #5E5A73">Note</label>
    <input id="note" value="SplitEasy · Office lunches" style="margin-top: 4px; box-sizing: border-box; width: 100%; height: 48px; border: 1px solid #E6E3EF; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #17142B">

    <button style="margin-top: 22px; height: 56px; border: none; border-radius: 16px; background: #5B3FD6; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path><path d="M7 15h4"></path></svg>
      Pay ₹600 with UPI app
    </button>
    <p style="margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: #5E5A73; text-align: center">Opens GPay, PhonePe, Paytm or another UPI app. If it reports success, Priya is asked to confirm.</p>
    <a href="#" style="margin-top: 10px; align-self: center; font-size: 14px; font-weight: 700; text-decoration: none; padding: 12px">Paid in cash? Record payment</a>
  </section>
</div>
</body>
</html>
