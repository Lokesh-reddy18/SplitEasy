<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set a guest's UPI ID</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4329B0}
</style>
</head>
<body>
<!-- Set a guest's UPI ID (F1, F10, H5). Any member can do this until the guest links an account.
     The warning makes clear the change is visible to everyone, which is what stops someone swapping in their own ID. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5F5A72; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17142B">
  <div style="padding: 24px 20px; color: #E6E3EF; opacity: 0.55">
    <div style="font-size: 18px; font-weight: 700">Group settings</div>
    <div style="font-size: 13px; margin-top: 2px">Coorg trip</div>
    <div style="margin-top: 24px; height: 60px; border-radius: 16px; background: #77728A"></div>
    <div style="margin-top: 16px; height: 220px; border-radius: 16px; background: #77728A"></div>
  </div>

  <section aria-label="Arjun's UPI ID" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D8D4E4; align-self: center"></div>
    <h2 style="margin: 18px 0 0; font-size: 20px; font-weight: 800">Arjun's UPI ID</h2>
    <p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #5E5A73">Arjun is a guest, so any member can set this until Arjun joins with an invite link.</p>

    <label for="upi" style="margin-top: 18px; font-size: 13px; font-weight: 600; color: #5E5A73">UPI ID</label>
    <input id="upi" value="arjun@oksbi" style="margin-top: 4px; box-sizing: border-box; width: 100%; height: 52px; border: 2px solid #5B3FD6; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 600; color: #17142B">

    <div style="margin-top: 14px; padding: 12px; border-radius: 12px; background: #FEF1E2; color: #8A4006; font-size: 13px; line-height: 1.5; display: flex; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5h.01"></path></svg>
      <span>Everyone in Coorg trip will see this change in the group feed: "You changed Arjun's UPI ID from arjun@okaxis to arjun@oksbi".</span>
    </div>

    <button style="margin-top: 20px; height: 56px; border-radius: 16px; border: none; background: #5B3FD6; font-family: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF">Save</button>
  </section>
</div>
</body>
</html>
