<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spending insights</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4329B0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F5FB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17142B; display: flex; flex-direction: column">
  <header style="padding: 24px 20px 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px">Insights</h1>
  </header>

  <div style="display: flex; gap: 8px; padding: 4px 20px 0">
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #17142B; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">Coorg trip
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D8D4E4; background: #FFFFFF; color: #17142B; font-family: inherit; font-size: 14px; font-weight: 600">October</button>
  </div>

  <section style="margin: 16px 20px 0; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E3EF">
    <div style="display: flex; justify-content: space-between">
      <div><div style="font-size: 13px; color: #5E5A73">Group spend</div><div style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px">₹24,000</div></div>
      <div style="text-align: right"><div style="font-size: 13px; color: #5E5A73">Your share</div><div style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px">₹4,800</div></div>
    </div>
  </section>

  <section style="margin: 12px 20px 0; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E3EF">
    <h2 style="margin: 0 0 14px; font-size: 15px; font-weight: 700">By category</h2>
    <div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px">
      <div style="width: 65%; background: #0E7490"></div>
      <div style="width: 25%; background: #5B3FD6"></div>
      <div style="width: 10%; background: #D9772F"></div>
    </div>
    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0E7490"></span><span style="flex-grow: 1; font-weight: 600">Travel</span><span style="color: #5E5A73; width: 40px; text-align: right">65%</span><span style="font-weight: 700; width: 70px; text-align: right">₹15,600</span></div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #5B3FD6"></span><span style="flex-grow: 1; font-weight: 600">Stay</span><span style="color: #5E5A73; width: 40px; text-align: right">25%</span><span style="font-weight: 700; width: 70px; text-align: right">₹6,000</span></div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #D9772F"></span><span style="flex-grow: 1; font-weight: 600">Food</span><span style="color: #5E5A73; width: 40px; text-align: right">10%</span><span style="font-weight: 700; width: 70px; text-align: right">₹2,400</span></div>
    </div>
  </section>

  <section style="margin: 12px 20px 0; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E3EF">
    <h2 style="margin: 0 0 14px; font-size: 15px; font-weight: 700">Who paid</h2>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Meera</span><span style="font-weight: 700">₹12,600</span></div><div style="margin-top: 6px; height: 8px; border-radius: 4px; background: #F0EEF5"><div style="width: 100%; height: 8px; border-radius: 4px; background: #0E7490"></div></div></div>
      <div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">You</span><span style="font-weight: 700">₹6,000</span></div><div style="margin-top: 6px; height: 8px; border-radius: 4px; background: #F0EEF5"><div style="width: 48%; height: 8px; border-radius: 4px; background: #0E7490"></div></div></div>
      <div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Arjun</span><span style="font-weight: 700">₹3,000</span></div><div style="margin-top: 6px; height: 8px; border-radius: 4px; background: #F0EEF5"><div style="width: 24%; height: 8px; border-radius: 4px; background: #0E7490"></div></div></div>
      <div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Priya</span><span style="font-weight: 700">₹2,400</span></div><div style="margin-top: 6px; height: 8px; border-radius: 4px; background: #F0EEF5"><div style="width: 19%; height: 8px; border-radius: 4px; background: #0E7490"></div></div></div>
    </div>
  </section>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E6E3EF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="02-groups-home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5A73; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6 6 0 0 1 3.5 6"></path></svg>
      Groups
    </a>
    <a href="08-insights.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B3FD6; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12"></path><path d="M12 20V5"></path><path d="M19 20v-9"></path></svg>
      Insights
    </a>
    <a href="09-profile.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5A73; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      Profile
    </a>
  </nav>
</div>
</body>
</html>
