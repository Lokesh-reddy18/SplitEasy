<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan a receipt</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4329B0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #110E21; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FFFFFF">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px">
    <a href="04-add-expense.html" aria-label="Close scanner" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 700">Scan receipt</span>
    <button aria-label="Flash" style="width: 44px; height: 44px; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
    </button>
  </header>

  <div style="position: absolute; left: 64px; top: 92px; width: 262px; height: 360px">
    <div style="position: absolute; left: 22px; top: 18px; width: 218px; height: 324px; background: #F4F1EA; border-radius: 4px; transform: rotate(-2deg); padding: 22px 20px; box-sizing: border-box; color: #3A3A3A; display: flex; flex-direction: column; gap: 9px">
      <div style="height: 10px; width: 120px; background: #3A3A3A; border-radius: 2px; align-self: center"></div>
      <div style="height: 6px; width: 90px; background: #A7A39B; border-radius: 2px; align-self: center"></div>
      <div style="height: 1px; background: #CFCBC2; margin: 6px 0"></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 96px; background: #A7A39B; border-radius: 2px"></div><div style="height: 6px; width: 34px; background: #A7A39B; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 72px; background: #A7A39B; border-radius: 2px"></div><div style="height: 6px; width: 34px; background: #A7A39B; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 110px; background: #A7A39B; border-radius: 2px"></div><div style="height: 6px; width: 34px; background: #A7A39B; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 84px; background: #A7A39B; border-radius: 2px"></div><div style="height: 6px; width: 34px; background: #A7A39B; border-radius: 2px"></div></div>
      <div style="height: 1px; background: #CFCBC2; margin: 6px 0"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px; margin: 0 -4px; border: 2px solid #9B87FF; border-radius: 4px"><div style="height: 9px; width: 54px; background: #3A3A3A; border-radius: 2px"></div><div style="height: 9px; width: 48px; background: #3A3A3A; border-radius: 2px"></div></div>
    </div>
    <div style="position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-left: 3px solid #9B87FF; border-top: 3px solid #9B87FF; border-radius: 10px 0 0 0"></div>
    <div style="position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-right: 3px solid #9B87FF; border-top: 3px solid #9B87FF; border-radius: 0 10px 0 0"></div>
    <div style="position: absolute; left: 0; bottom: 0; width: 36px; height: 36px; border-left: 3px solid #9B87FF; border-bottom: 3px solid #9B87FF; border-radius: 0 0 0 10px"></div>
    <div style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; border-right: 3px solid #9B87FF; border-bottom: 3px solid #9B87FF; border-radius: 0 0 10px 0"></div>
  </div>

  <section aria-label="Scan result" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; color: #17142B; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800; flex-grow: 1">Found on receipt</h2>
      <span style="font-size: 12px; font-weight: 700; color: #4329B0; background: #ECE8FD; padding: 4px 8px; border-radius: 6px">Read on your phone</span>
    </div>
    <div style="margin-top: 14px; border: 1px solid #E6E3EF; border-radius: 14px; display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid #F0EEF5; font-size: 15px"><span style="color: #5E5A73">Merchant</span><span style="font-weight: 700">Raintree Restaurant</span></div>
      <div style="display: flex; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid #F0EEF5; font-size: 15px"><span style="color: #5E5A73">Total</span><span style="font-weight: 700">₹2,400</span></div>
      <div style="display: flex; justify-content: space-between; padding: 13px 14px; font-size: 15px"><span style="color: #5E5A73">Date</span><span style="font-weight: 700">10 Oct 2026</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px">
      <button style="height: 52px; border-radius: 14px; border: 1px solid #E6E3EF; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #17142B">Retake</button>
      <a href="04-add-expense.html" style="height: 52px; border-radius: 14px; background: #5B3FD6; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Use details</a>
    </div>
  </section>
</div>
</body>
</html>
