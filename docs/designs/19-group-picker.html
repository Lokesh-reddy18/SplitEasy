<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group picker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD6}a:hover{color:#4329B0}
</style>
</head>
<body>
<!-- Group picker (Q15). Opened by "Add expense" on Groups home and by the widget's "+".
     The last-used group is first so it's one tap. Archived groups aren't listed. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5F5A72; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17142B">
  <div style="padding: 24px 20px; color: #E6E3EF; opacity: 0.55">
    <div style="font-size: 20px; font-weight: 800">SplitEasy</div>
    <div style="margin-top: 24px; height: 180px; border-radius: 20px; background: #77728A"></div>
    <div style="margin-top: 16px; height: 200px; border-radius: 16px; background: #77728A"></div>
  </div>

  <section aria-label="Add expense to" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D8D4E4; align-self: center"></div>
    <h2 style="margin: 18px 0 12px; font-size: 20px; font-weight: 800">Add expense to</h2>
    <div style="border: 1px solid #E6E3EF; border-radius: 16px; display: flex; flex-direction: column">
      <a href="04-add-expense.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; border-bottom: 1px solid #F0EEF5">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #E0F2F5; color: #0E7490; font-weight: 700; display: flex; align-items: center; justify-content: center">CT</div>
        <div style="flex-grow: 1"><div style="font-size: 15px; font-weight: 600">Coorg trip</div><div style="font-size: 13px; color: #5E5A73">5 members</div></div>
        <span style="font-size: 12px; font-weight: 700; color: #4329B0; background: #ECE8FD; padding: 3px 8px; border-radius: 6px">Last used</span>
      </a>
      <a href="04-add-expense.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; border-bottom: 1px solid #F0EEF5">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #ECE8FD; color: #4329B0; font-weight: 700; display: flex; align-items: center; justify-content: center">FB</div>
        <div style="flex-grow: 1"><div style="font-size: 15px; font-weight: 600">Flat 4B</div><div style="font-size: 13px; color: #5E5A73">4 members</div></div>
      </a>
      <a href="04-add-expense.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; border-bottom: 1px solid #F0EEF5">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #FEF1E2; color: #8A4006; font-weight: 700; display: flex; align-items: center; justify-content: center">OL</div>
        <div style="flex-grow: 1"><div style="font-size: 15px; font-weight: 600">Office lunches</div><div style="font-size: 13px; color: #5E5A73">6 members</div></div>
      </a>
      <a href="04-add-expense.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #F0EEF5; color: #403B55; font-weight: 700; display: flex; align-items: center; justify-content: center">HM</div>
        <div style="flex-grow: 1"><div style="font-size: 15px; font-weight: 600">Home</div><div style="font-size: 13px; color: #5E5A73">2 members</div></div>
      </a>
    </div>
    <a href="11-create-group.html" style="margin-top: 12px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>New group
    </a>
  </section>
</div>
</body>
</html>
