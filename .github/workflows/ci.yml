name: CI

# One run per PR update, and one after each merge to main.
# (Triggering on every push as well would run CI twice for branches with an open PR.)
# Changes that only touch docs or designs don't affect the app, so they skip the build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# The workflow only reads the repo; nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Fail if gradle-wrapper.jar doesn't match an official Gradle release.
          validate-wrappers: true
          # PRs reuse main's cache but don't write their own, so it stays small and clean.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Firebase config is git-ignored; CI recreates it from a repository secret.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Lint, test and check coverage
        run: ./gradlew ktlintCheck lint test koverVerify assembleDebug

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload debug APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: splitEasy-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

  # Firestore security rules, tested against the Firestore emulator (M4-Q7).
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # The emulator runs on Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the Firestore emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ hashFiles('firebase/package-lock.json') }}

      - run: npm ci

      - name: Test the rules
        run: npm test

